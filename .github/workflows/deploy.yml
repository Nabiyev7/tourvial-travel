name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Lets the site go live before the first PR is merged. Drop this line
      # once the branch has landed on main.
      - claude/quirky-archimedes-cfige3
  workflow_dispatch:

# `configure-pages` needs pages:write to switch Pages on the first time.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; don't cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build should never reach the live site.
      - run: npm run typecheck
      - run: npm run lint

      - id: pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on the first time this runs, so no manual setup step is
          # needed in the repository settings.
          enablement: true

      - name: Build static site
        env:
          NEXT_OUTPUT: export
          # A GitHub Pages project site is served from /<repo>/.
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Tells GitHub Pages not to run the output through Jekyll, which would
      # otherwise drop the _next directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
