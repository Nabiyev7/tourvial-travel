name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Lets the site stay current before the first PR is merged. Drop this
      # line once the branch has landed on main.
      - claude/quirky-archimedes-cfige3
  workflow_dispatch:

# Pages serves this repository from the gh-pages branch, so publishing is a
# push to that branch rather than an upload-pages-artifact / deploy-pages pair.
# The Actions source would be tidier, but switching to it needs the Create
# Pages site API, which refuses the workflow token ("Resource not accessible by
# integration") — see PR #1. Pushing a branch needs only contents: write.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build should never reach the live site.
      - run: npm run typecheck
      - run: npm run lint

      - name: Build static site
        env:
          NEXT_OUTPUT: export
          # A GitHub Pages project site is served from /<repo>/.
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Without this, Pages runs the output through Jekyll, which drops _next.
      - run: touch out/.nojekyll

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} to GitHub Pages"
          # gh-pages holds generated output only, so each deploy replaces it
          # rather than piling up build commits nobody reads.
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
